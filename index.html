<style>
:root{--b:#2563ff;--bg:#eef3fe;--t:#26211d;--m:#6b7280;--l:#e3e8f2;--in:#16a34a;--out:#ef4444;--bor:#d97706}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);max-width:560px;margin:auto}
#v{height:100%;overflow-y:auto;padding-bottom:120px}
button{font:inherit;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hd{padding:calc(16px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))) 16px 64px;color:#fff}
.h1{background:linear-gradient(160deg,#2fa8e2,#3b82ec)}.h2{background:#1d0aa6}
.hd h1{font-size:20px;font-weight:600}
.who{display:flex;align-items:center;gap:12px}.who b{font-size:18px}
.av{width:50px;height:50px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:700;flex:none}
.ib{background:none;border:0;color:#fff;font-size:26px;padding:2px 8px;display:flex;align-items:center}.ib svg{width:24px;height:24px}svg.i{display:block}.sc i svg,.li i svg{width:22px;height:22px}.mn button{display:grid;place-items:center}.mn button svg{width:18px}.eye,.x{display:flex;align-items:center}.eye svg{width:22px;height:22px}.x svg{width:20px;height:20px}
.top{padding:calc(14px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))) 8px 8px;display:flex;align-items:center;justify-content:space-between}
.top b{font-size:18px}.top .ib{color:var(--t);width:40px}
.body{padding:0 12px}.first{margin-top:-50px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.big{font-size:28px;font-weight:700}
.m{color:var(--m);font-size:13px}
.st{font-weight:600;margin:14px 2px 8px}
.eye{background:none;border:0;font-size:22px;color:var(--t)}
.sc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:13px}
.sc i{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;margin:0 auto 6px;font-style:normal;font-size:22px;background:var(--bg);color:var(--b)}
.mn{margin:2px 0 10px}.mn button{background:#fff;border:0;border-radius:10px;width:38px;height:34px;font-size:20px}.mn b{font-size:16px}
.sel{width:100%;font:inherit;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fff}
.bars{display:flex;gap:12px;align-items:flex-end;height:110px}
.bars i{width:44px;border-radius:6px 6px 0 0;min-height:3px}
.dn{width:118px;height:118px;border-radius:50%;position:relative;flex:none}
.dn::after{content:"";position:absolute;inset:27px;background:#fff;border-radius:50%}
s{display:inline-block;width:14px;height:14px;border-radius:5px;margin-right:8px;vertical-align:-2px}
.lg{flex:1;display:flex;flex-direction:column;gap:6px;margin-left:16px;font-size:14px}
.in{color:var(--in)}.out{color:var(--out)}.neg{color:var(--out)}
.ai{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#e6f0ff;color:var(--b);font-weight:700;font-style:normal}
.x{background:none;border:0;font-size:20px;color:var(--m);padding:4px 8px}
.rb{background:linear-gradient(135deg,#2f6bff,#2b3be0);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;text-align:center}
.rb .big{font-size:30px}.rb .sub{display:flex;gap:10px;margin-top:12px;text-align:left}
.rb .sub div{flex:1;background:#ffffff26;border-radius:14px;padding:10px 12px;font-size:13px}.rb .sub b{display:block;font-size:17px}
.mb{display:flex;gap:10px;align-items:flex-end}
.mb>div{flex:1;text-align:center;font-size:13px;color:var(--m)}
.tr{position:relative;height:90px;background:#f1f3f7;border-radius:5px;margin-bottom:4px;overflow:hidden}
.tr u{position:absolute;bottom:0;left:0;right:0;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal div{min-height:54px;border:1px solid var(--l);border-radius:8px;padding:3px 4px;font-size:11px;text-align:right;overflow:hidden}
.cal div span{display:block;text-align:left;font-size:12px;color:var(--t)}
.cal .h{border:0;min-height:0;text-align:center;color:var(--m);font-size:13px}
.sum{background:#f0f6ff;border-radius:12px;padding:10px;display:flex;text-align:center}.sum div{flex:1}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tl .card{margin:0;font-size:15px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--l)}.li:last-child{border:0}
.li i{width:42px;height:42px;border-radius:12px;background:#e9efff;color:var(--b);display:grid;place-items:center;font-style:normal;font-size:19px}
.li span{flex:1}.li u{text-decoration:none;color:var(--m);font-size:20px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(96px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));width:56px;height:56px;border-radius:50%;background:var(--b);color:#fff;border:0;font-size:32px;box-shadow:0 4px 12px #2563ff66;z-index:4;display:none}
nav{position:fixed;left:0;right:0;bottom:calc(6px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));max-width:560px;margin:0 auto;padding:0 14px;z-index:5}

nav button{background:none;border:0;color:rgba(255,255,255,.72);font-size:11.5px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding:0;height:100%;white-space:nowrap}
nav button b{display:grid;place-items:center;width:26px;height:26px;line-height:0}
nav button b svg{width:23px;height:23px}
nav button span{display:block;height:14px;line-height:14px}
nav button.on{color:#fff;font-weight:600}
nav button.add-pill{color:#fff;font-weight:500}
nav button.add-pill b{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--b);box-shadow:0 2px 8px rgba(0,0,0,.18);margin-bottom:-2px}
nav button.add-pill b svg{width:21px;height:21px;stroke-width:2.8}
.action-sheet-item{display:flex;align-items:center;gap:16px;padding:15px 6px;border-bottom:1px solid #f1f3f8;font-size:16px;cursor:pointer}.action-sheet-item:last-child{border:0}
.action-sheet-item svg{width:22px;height:22px;color:#555;flex:none}.action-sheet-item.danger{color:var(--out)}.action-sheet-item.danger svg{color:var(--out)}
.tip{background:linear-gradient(135deg,#1e3a8a,#2563ff);color:#fff;padding:12px 14px;border-radius:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.4}.tip svg{width:24px;height:24px;flex:none}
.btn{border:0;border-radius:12px;padding:11px 14px;font-size:15px;background:var(--b);color:#fff;font-weight:600}
.btn.g{background:var(--l);color:var(--t)}.btn.r{background:#fee2e2;color:var(--out)}
.btns{display:flex;gap:8px;margin-top:14px}.btns .btn{flex:1}
#m{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}
#m.on{display:flex}
#m>div{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow-y:auto;padding-bottom:calc(16px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)))}
#m h2{font-size:17px;margin-bottom:6px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fff;color:var(--t)}
.seg{display:flex;border:1px solid var(--l);border-radius:12px;overflow:hidden;margin-top:8px}
.seg button{flex:1;border:0;background:#fff;padding:10px}
.seg button.on.o{background:var(--out);color:#fff}.seg button.on.i{background:var(--in);color:#fff}
.tab2{display:flex;gap:8px;margin-bottom:10px}.tab2 button{flex:1;border:0;background:#fff;border-radius:12px;padding:10px;font-size:14px}
.tab2 button.on{background:var(--b);color:#fff}
.bar{height:6px;background:var(--l);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}
.grp{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:6px}
.it{padding:11px 14px;border-bottom:1px solid var(--l)}.it:last-child{border:0}
h3{font-size:13px;color:var(--m);font-weight:600;margin:12px 2px 6px}
.empty{text-align:center;color:var(--m);padding:36px 10px}
#ts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#26211d;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#ts.on{opacity:.92}

.ad{background:linear-gradient(#c8d5f8 0,#e6ecfb 280px,var(--bg) 560px);min-height:100%}
.adh{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))) 14px 6px}
.cb{width:48px;height:48px;border-radius:50%;background:#f3f5fb;border:1px solid #fff;box-shadow:0 2px 6px #0001;display:grid;place-items:center;color:var(--t)}.cb svg{width:24px;height:24px}
.tsel{border:1.5px solid var(--b);background:#fff;color:var(--b);font-weight:600;font-size:20px;border-radius:12px;padding:8px 18px}
.tmenu{position:absolute;left:50%;transform:translateX(-50%);top:54px;background:#fff;border-radius:12px;box-shadow:0 4px 16px #0003;overflow:hidden;z-index:6;min-width:150px}.tmenu div{padding:12px 18px;font-size:17px;border-bottom:1px solid var(--l)}.tmenu div:last-child{border:0}
.amv{font-size:34px;font-weight:700;margin-top:4px;word-break:break-all}
.ct{display:grid;place-items:center;width:56px;height:56px;border-radius:16px;font-size:28px;font-style:normal;flex:none}
.ct.dash{border:2px dashed #cfd5e2;background:#f4f6fa;color:#9aa3b5;width:50px;height:50px;border-radius:14px}.ct.dash svg{width:26px;height:26px}
.ct.sm{width:42px;height:42px;border-radius:12px;background:#e6f0ff;color:var(--b)}.ct.sm svg{width:24px;height:24px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;margin-top:14px;text-align:center;font-size:15px}
.cgi{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}.cgi span{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cgi.sel .ct{box-shadow:0 0 0 2.5px var(--b)}
.lk{color:var(--b);font-size:18px;display:flex;align-items:center;gap:4px}.lk svg{width:20px;height:20px}
.rf{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--l);font-size:18px;position:relative}.rf:last-child{border:0}.rf>svg{width:26px;height:26px;color:#4b5563;flex:none}.rf .f{flex:1}
.rf .nt{border:0;padding:0;background:none;font-size:18px}.rf.rel .ov{position:absolute;top:0;bottom:0;opacity:0;border:0;padding:0;height:100%}
#kp{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;background:#ebedf1;z-index:9;display:none;padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}#kp.on{display:block}
.kg{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #d3d6dc}
.kg button{border:0;border-right:1px solid #d3d6dc;border-bottom:1px solid #d3d6dc;background:#fff;font-size:30px;height:60px;color:var(--t);display:grid;place-items:center}
.kg .o{background:#e8eaef}.kg .go{background:var(--b);color:#fff;font-size:26px;font-weight:500;height:auto;grid-column:4;grid-row:4/6}.kg svg{width:30px;height:30px}
body.kpo #v{padding-bottom:380px}
.ptabs{display:flex;background:#fff;border-bottom:1px solid var(--l)}.ptabs button{flex:1;border:0;background:none;padding:14px 0;font-size:18px;font-weight:500;border-bottom:3px solid transparent}.ptabs .on{color:var(--b);border-color:var(--b)}
.srch{display:flex;align-items:center;gap:10px;margin:12px;padding:12px;border:1.5px solid var(--l);border-radius:12px;background:#fff}.srch input{border:0;padding:0;font-size:17px}.srch svg{width:24px;height:24px;color:var(--m);flex:none}
.gs{background:#fff;margin-bottom:12px;padding-bottom:10px}.gh{display:flex;align-items:center;gap:14px;padding:16px;color:var(--b);font-weight:700;font-size:20px}.gs .cg{padding:0 10px 8px;margin-top:2px}
</style></head>
<body>
<div id="v"></div>
<button class="fab" id="fab" onclick="fabGo()">+</button>
<nav><div class="nav-bar">
<button data-t="home" onclick="go('home')"><b data-i="home"></b><span>Tổng quan</span></button>
<button data-t="acc" onclick="go('acc')"><b data-i="wallet"></b><span>Tài khoản</span></button>
<button class="add-pill" onclick="txForm()"><b data-i="plus"></b><span>Ghi chép</span></button>
<button data-t="rep" onclick="go('rep')"><b data-i="pie"></b><span>Báo cáo</span></button>
<button data-t="more" onclick="go('more')"><b data-i="grid"></b><span>Khác</span></button>
</div></nav>
<div id="m" onclick="if(event.target==this)closeM()"><div id="mb"></div></div>
<div id="kp"><div class="kg">
<button class="o" onclick="kk('C')">C</button><button class="o" onclick="kk('/')">÷</button><button class="o" onclick="kk('*')">×</button><button class="o" onclick="kk('B')" id="kb"></button>
<button onclick="kk('7')">7</button><button onclick="kk('8')">8</button><button onclick="kk('9')">9</button><button class="o" onclick="kk('-')">−</button>
<button onclick="kk('4')">4</button><button onclick="kk('5')">5</button><button onclick="kk('6')">6</button><button class="o" onclick="kk('+')">+</button>
<button onclick="kk('1')">1</button><button onclick="kk('2')">2</button><button onclick="kk('3')">3</button>
<button onclick="kk('0')">0</button><button onclick="kk('000')">000</button><button onclick="kk(',')">,</button>
<button class="go" onclick="kdone()">Xong</button></div></div>
<div id="ts"></div>
<script>
const $=s=>document.querySelector(s);
const IC={home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-8z"/>',wallet:'<path d="M4 8V7a2 2 0 0 1 2-2h11v3"/><rect x="3" y="8" width="18" height="11.5" rx="2.5"/><path d="M16 13.8h2.6"/>',plus:'<path d="M12 5v14M5 12h14"/>',pie:'<path d="M11 4a8.5 8.5 0 1 0 9 9h-9V4z"/><path d="M14.5 3.6A8.5 8.5 0 0 1 20.4 9.5h-5.9V3.6z"/>',grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/>',list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="5" cy="6" r=".8"/><circle cx="5" cy="12" r=".8"/><circle cx="5" cy="18" r=".8"/>',hist:'<path d="M4 12a8 8 0 1 0 2.6-5.9L4 8.5"/><path d="M4 4v4.5h4.5M12 8v4l3 2"/>',lend:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v10M14.6 9.6c0-1-1.1-1.7-2.6-1.7s-2.6.7-2.6 1.8 1.2 1.5 2.6 1.8 2.6.8 2.6 1.8-1.1 1.8-2.6 1.8-2.6-.8-2.6-1.8"/>',borrow:'<path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/>',swap:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',cloud:'<path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 10.5 3.75 3.75 0 0 1 17.5 18H7z"/><path d="M12 16v-5M9.8 13.2L12 11l2.2 2.2"/>',sync:'<path d="M20 11a8 8 0 0 0-14-4.5L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4.5L20 15M20 20v-5h-5"/>',eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',eyeoff:'<path d="M3 3l18 18M10.6 5.7a9.6 9.6 0 0 1 1.4-.2c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-3 3.8M6.3 7.3A16 16 0 0 0 2.5 12S6 18.5 12 18.5a9.6 9.6 0 0 0 4-.9"/>',back:'<path d="M15 5l-7 7 7 7"/>',chL:'<path d="M14 6l-6 6 6 6"/>',chR:'<path d="M10 6l6 6-6 6"/>',dots:'<circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',cal:'<rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/>',lines:'<path d="M5 7h14M5 12h10M5 17h7"/>',chU:'<path d="M6 14l6-6 6 6"/>',chD:'<path d="M6 10l6 6 6-6"/>',pencil:'<path d="M4 20l4-1 10.5-10.5-3-3L5 16l-1 4z"/>',bksp:'<path d="M9 6h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5-6 5-6z"/><path d="M12 10l4 4M16 10l-4 4"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',unlock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',transfer:'<path d="M7 10h14l-4-4M17 14H3l4 4"/>',adjust:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 12h6"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;
document.getElementById("kb").innerHTML=ic("bksp");document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));
const K='sothuchi';
const J=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
let S=J(K);
if(!S||!S.acc)S={acc:[{id:'a1',name:'Tiền mặt',init:0,u:1}],tx:[],debt:[]};
const now=()=>Date.now(),uid=()=>now().toString(36)+Math.random().toString(36).slice(2,6);
let pt,busy=0,again=0;
const save=q=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Không lưu được dữ liệu')}if(!q)push()};
const push=()=>{if(!SY.gr)return;clearTimeout(pt);pt=setTimeout(()=>driveSync(0),3000)};
const A=()=>S.acc.filter(a=>!a.x&&!a.disabled),AAll=()=>S.acc.filter(a=>!a.x),T=()=>S.tx.filter(t=>!t.x),D=()=>S.debt.filter(d=>!d.x);
const kill=(r,f)=>r.forEach(o=>{if(!o.x&&f(o)){o.x=1;o.u=now()}});
const fmt=n=>Math.round(n).toLocaleString('vi-VN');
const today=()=>new Date(now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dm=d=>d?d.split('-').reverse().join('/'):'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const accN=id=>(S.acc.find(a=>a.id==id)||{name:'(đã xóa)'}).name;

function accMenu(id){
  const a=AAll().find(x=>x.id==id);if(!a)return;
  const it=(i,t,f,c)=>`<div class="action-sheet-item ${c||''}" onclick="${f}">${ic(i)}<span>${t}</span></div>`;

   +it('transfer','Chuyển khoản',`xferForm('${id}')`)
   +it('adjust','Điều chỉnh số dư',`adjForm('${id}')`)
   +it('share','Chia sẻ số dư',`shareAcc('${id}')`)

function xferForm(from){
  const L=A().filter(x=>x.id!=from);if(!L.length)return toast('Cần ít nhất 2 tài khoản đang sử dụng để chuyển khoản');
  const a=S.acc.find(x=>x.id==from);
  openM(`<h2>Chuyển từ "${esc(a.name)}"</h2><label>Tài khoản nhận</label><select id="f1">${L.map(x=>`<option value="${x.id}">${esc(x.name)} (${fmt(bal(x))} ₫)</option>`).join('')}</select><label>Số tiền</label><input id="f2" type="number" inputmode="decimal" placeholder="0"><label>Ngày</label><input id="f3" type="date" value="${today()}"><label>Ghi chú</label><input id="f4"><div class="btns"><button class="btn g" onclick="closeM()">Hủy</button><button class="btn" onclick="xferSave('${from}')">Chuyển</button></div>`);

function xferSave(from){
  const to=$('#f1').value,amt=Math.round(+$('#f2').value);if(!(amt>0))return toast('Nhập số tiền lớn hơn 0');
  const d=$('#f3').value||today(),note=$('#f4').value.trim(),xf=uid(),tm=hmNow();
  S.tx.push({id:uid(),u:now(),type:'out',amt,acc:from,cat:'Chuyển khoản',note:note||'Chuyển sang '+accN(to),date:d,tm,xf});
  S.tx.push({id:uid(),u:now(),type:'in',amt,acc:to,cat:'Chuyển khoản',note:note||'Nhận từ '+accN(from),date:d,tm,xf});
  save();closeM();render(1);toast('Đã chuyển khoản');
}
function adjForm(id){
  const a=S.acc.find(x=>x.id==id),cur=bal(a);
  openM(`<h2>Điều chỉnh số dư: ${esc(a.name)}</h2><div class="m">Số dư trong app: <b>${fmt(cur)} ₫</b></div><label>Số dư thực tế</label><input id="f1" type="number" inputmode="decimal" value="${Math.round(cur)}"><label>Ghi chú</label><input id="f2" placeholder="Kiểm kê thực tế"><div class="btns"><button class="btn g" onclick="closeM()">Hủy</button><button class="btn" onclick="adjSave('${id}')">Cập nhật</button></div>`);

function adjSave(id){
  const a=S.acc.find(x=>x.id==id),diff=Math.round(+$('#f1').value-bal(a));
  if(!diff){closeM();return toast('Số dư không đổi')}
  S.tx.push({id:uid(),u:now(),type:diff>0?'in':'out',amt:Math.abs(diff),acc:id,cat:'Điều chỉnh số dư',note:$('#f2').value.trim(),date:today(),tm:hmNow(),adj:1});
  save();closeM();render(1);toast('Đã điều chỉnh số dư');

function spDel(id){
  const t=S.tx.find(x=>x.id==id);if(!t||!confirm(t.xf?'Xóa cả hai phía của lần chuyển khoản này?':'Xóa khoản điều chỉnh này?'))return;
  if(t.xf)kill(S.tx,x=>x.xf==t.xf);else kill(S.tx,x=>x.id==id);
  save();closeM();render(1);
}
function accForm(id){
  const a=AAll().find(x=>x.id==id)||{name:'',init:0};
  openM(`<h2>${id?'Sửa':'Thêm'} tài khoản</h2><label>Tên tài khoản</label><input id="f1" value="${esc(a.name)}" placeholder="Tiền mặt, MB Bank…"><label>Số dư ban đầu</label><input id="f2" type="number" inputmode="decimal" value="${a.init||0}"><div class="btns">${id?`<button class="btn r" onclick="accDel('${id}')">Xóa</button>`:''}<button class="btn g" onclick="closeM()">Hủy</button><button class="btn" onclick="accSave('${id||''}')">Lưu</button></div>`);
}
function accSave(id){
  const n=$('#f1').value.trim();if(!n)return toast('Nhập tên tài khoản');
  const i=+$('#f2').value||0;
  if(id){const a=S.acc.find(x=>x.id==id);a.name=n;a.init=i;a.u=now()}else S.acc.push({id:uid(),u:now(),name:n,init:i});
  save();closeM();render(1);
}
function accDel(id){
  const c=T().filter(t=>t.acc==id).length;
  if(!confirm(c?`Xóa tài khoản và ${c} giao dịch của nó?`:'Xóa tài khoản này?'))return;
  kill(S.acc,a=>a.id==id);kill(S.tx,t=>t.acc==id);
  const dead=new Set(S.tx.filter(t=>t.x&&t.first).map(t=>t.debt));
  kill(S.debt,d=>dead.has(d.id));kill(S.tx,t=>t.debt&&dead.has(t.debt));
  if(fa==id)fa='';
  save();closeM();render(1);
}

function vHist(){
  const all=T().filter(t=>t.date.slice(0,7)==fm&&(!fa||t.acc==fa)).sort((a,b)=>b.date.localeCompare(a.date)||(b.u||0)-(a.u||0));
  const R=all.filter(t=>!isSp(t)),i=sum(R,'in'),o=sum(R,'out');
  let h=hdr('Lịch sử ghi chép')+`<div class="body">${mnav()}<select class="sel" onchange="fa=this.value;render(1)"><option value="">Tất cả tài khoản</option>${AAll().map(a=>`<option value="${a.id}" ${a.id==fa?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
  <div class="card" style="margin-top:10px"><div class="sum"><div><div class="m">Tổng thu</div><b class="in">${fmt(i)}</b></div><div><div class="m">Tổng chi</div><b class="out">${fmt(o)}</b></div><div><div class="m">Chênh lệch</div><b>${fmt(i-o)}</b></div></div></div>`;
  if(!all.length)return h+'<div class="empty">Không có giao dịch trong tháng này.</div></div>';
  [...new Set(all.map(t=>t.date))].forEach(d=>{
    h+=`<h3>${dm(d)}</h3><div class="grp">`+all.filter(t=>t.date==d).map(t=>`<div class="it row" onclick="txForm('${t.id}')"><div><b>${esc(t.cat||(t.type=='in'?'Khoản thu':'Khoản chi'))}</b><div class="m">${esc(accN(t.acc))}${t.tm?' · '+esc(t.tm):''}${t.note?' · '+esc(t.note):''}</div></div><b class="${t.type}">${t.type=='in'?'+':'−'}${fmt(t.amt)}</b></div>`).join('')+'</div>';
  });
  return h+'</div>';
}

  <label>Ngày</label><input id="f4" type="date" value="${today()}">
  <label>Hạn ${b?'trả':'thu'} (không bắt buộc)</label><input id="f5" type="date">
  <label>Ghi chú</label><input id="f6">
  <div class="btns"><button class="btn g" onclick="closeM()">Hủy</button><button class="btn" onclick="debtSave('${kind}')">Lưu</button></div>`);
}
function debtSave(kind){
  const person=$('#f1').value.trim(),amt=+$('#f2').value;
  if(!person)return toast('Nhập tên người');if(!(amt>0))return toast('Nhập số tiền lớn hơn 0');
  const d={id:uid(),u:now(),kind,person,amt,date:$('#f4').value||today(),due:$('#f5').value,note:$('#f6').value.trim()};
  S.debt.push(d);
  S.tx.push({id:uid(),u:now(),type:kind=='borrow'?'in':'out',amt,acc:$('#f3').value,cat:kind=='borrow'?'Đi vay':'Cho vay',note:person,date:d.date,debt:d.id,first:true});
  save();closeM();render(1);
}
function debtView(id){
  const d=D().find(x=>x.id==id),b=d.kind=='borrow',p=paid(d),r=d.amt-p;
  const pays=T().filter(t=>t.debt==id&&!t.first).sort((x,y)=>y.date.localeCompare(x.date));
  openM(`<h2>${esc(d.person)}</h2><div class="m">${b?'Khoản vay':'Khoản cho vay'} ${fmt(d.amt)} ₫ · ${dm(d.date)}${d.due?' · hạn '+dm(d.due):''}</div>${d.note?`<div class="m">${esc(d.note)}</div>`:''}
  <div class="sum" style="margin-top:10px"><div><div class="m">Đã ${b?'trả':'thu'}</div><b>${fmt(p)} ₫</b></div><div><div class="m">Còn lại</div><b style="color:${b?'var(--bor)':'var(--in)'}">${fmt(Math.max(0,r))} ₫</b></div></div>
  ${pays.length?'<h3>Lịch sử</h3>'+pays.map(t=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--l)"><span>${dm(t.date)} · <span class="m">${esc(accN(t.acc))}</span></span><span><b>${fmt(t.amt)}</b> <a class="out" onclick="payDel('${t.id}','${id}')">xóa</a></span></div>`).join(''):''}
  ${r>0?`<h3>${b?'Trả nợ':'Thu nợ'}</h3><label>Số tiền</label><input id="f1" type="number" inputmode="decimal" value="${r}"><label>Tài khoản</label><select id="f2">${A().map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><label>Ngày</label><input id="f3" type="date" value="${today()}">`:''}
  <div class="btns"><button class="btn r" onclick="debtDel('${id}')">Xóa khoản</button><button class="btn g" onclick="closeM()">Đóng</button>${r>0?`<button class="btn" onclick="payAdd('${id}')">${b?'Trả nợ':'Thu nợ'}</button>`:''}</div>`);
}
function payAdd(id){
  const d=D().find(x=>x.id==id),a=+$('#f1').value;
  if(!(a>0))return toast('Nhập số tiền lớn hơn 0');
  if(a>d.amt-paid(d)&&!confirm('Số tiền lớn hơn phần còn lại. Vẫn ghi nhận?'))return;
  S.tx.push({id:uid(),u:now(),type:d.kind=='borrow'?'out':'in',amt:a,acc:$('#f2').value,cat:d.kind=='borrow'?'Trả nợ':'Thu nợ',note:d.person,date:$('#f3').value||today(),debt:id});
  save();render(1);debtView(id);
}
function payDel(tid,id){if(!confirm('Xóa lần này?'))return;kill(S.tx,t=>t.id==tid);save();render(1);debtView(id)}
function debtDel(id){if(!confirm('Xóa khoản này cùng mọi giao dịch liên quan?'))return;kill(S.debt,d=>d.id==id);kill(S.tx,t=>t.debt==id);save();closeM();render(1)}

function vMore(){
  const li=(i,t,f)=>`<div class="li" onclick="${f}"><i>${i}</i><span>${t}</span><u>›</u></div>`;
  return hdr('Khác',0)+`<div class="body">${syncCard()}
  <h3>Bạn hay dùng</h3><div class="card" style="padding:0">${li(ic('list'),'Hạng mục thu/chi',"openCats()")}${li(ic('hist'),'Lịch sử ghi chép',"fa='';op('hist')")}${li(ic('swap'),'Vay / Cho vay',"op('debt')")}${li(ic('cloud'),'Sao lưu lên Google Drive','dataForm()')}</div></div>`;
}
function dataForm(){
  openM(`<h2>Sao lưu dữ liệu</h2><p class="m">Bấm lưu file rồi chọn Google Drive ở bảng chia sẻ (điện thoại), hoặc tải file về rồi tải lên Drive (máy tính). Khi cần, chọn lại file đó để khôi phục.</p>
  <div class="btns" style="flex-direction:column"><button class="btn" onclick="backupFile()">Lưu file sao lưu (để đưa lên Google Drive)</button><button class="btn g" onclick="$('#rf').click()">Khôi phục từ file sao lưu (.json)</button></div>
  <input id="rf" type="file" accept=".json,application/json" style="display:none" onchange="restoreFile(this)">
  <div class="m" style="margin-top:14px">Nếu không chia sẻ được file, dùng cách dự phòng:</div><div class="btns" style="margin-top:6px"><button class="btn g" onclick="codeForm()">Hiện mã sao lưu</button></div>`);
}
async function backupFile(){
  const t=new Date(),p2=x=>String(x).padStart(2,'0'),n=`sao-luu-thu-chi-${t.getFullYear()}${p2(t.getMonth()+1)}${p2(t.getDate())}-${p2(t.getHours())}${p2(t.getMinutes())}.json`,txt=JSON.stringify(S);
  try{const C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()){const P=C.Plugins,w=await P.Filesystem.writeFile({path:n,data:txt,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:n,url:w.uri,dialogTitle:'Lưu file sao lưu (chọn Drive)'});return}}
  catch(e){if(e&&/cancel/i.test(String(e.message||e)))return;toast('Không chia sẻ được file: '+((e&&e.message)||e))}
  try{const f=new File([txt],n,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n});return}}catch(e){if(e&&e.name=='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();a.remove()}catch(e){toast("Không lưu được file. Hãy dùng 'Hiện mã sao lưu'.")}
}
function restoreFile(el){
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.acc||!d.tx||!d.debt)throw 0;if(!confirm('Khôi phục sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;S=d;fixCats();save();closeM();render();toast('Đã khôi phục')}catch(e){toast('File không hợp lệ')}};
  r.readAsText(f);
}
function codeForm(){
  openM(`<h2>Mã sao lưu</h2><textarea id="bk" rows="5">${esc(JSON.stringify(S))}</textarea>
  <div class="btns"><button class="btn g" onclick="$('#bk').select();document.execCommand('copy')">Sao chép</button><button class="btn" onclick="restore()">Khôi phục từ ô trên</button></div>`);
}
function restore(){
  try{const d=JSON.parse($('#bk').value);if(!d.acc||!d.tx||!d.debt)throw 0;
    if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu?'))return;
    S=d;fixCats();save();closeM();render();
  }catch(e){toast('Mã sao lưu không hợp lệ')}
}

/* ---- Đăng nhập Google & đồng bộ Drive (cùng cách với app bán hàng) ---- */
const FILE='sothuchi.json',FORM={'Content-Type':'application/x-www-form-urlencoded'};
let SY=J('sothuchi_sync')||{},gsyncing=false,polling=false;
const saveSY=()=>{try{localStorage.setItem('sothuchi_sync',JSON.stringify(SY))}catch(e){}};
const enc=encodeURIComponent,sleep=ms=>new Promise(z=>setTimeout(z,ms));
const WEB=!(window.Capacitor||window.nativeFetch);
const cred=()=>{const d=window.DRIVE||{};return{id:(WEB?d.webClientId:d.clientId)||SY.gid||'',sec:d.clientSecret||SY.gsc||''}};
async function gf(u,o){
  o=o||{};const t=new Promise((_,rj)=>setTimeout(()=>rj(new Error('Không kết nối được Google')),20000));
  const run=(async()=>{if(window.nativeFetch)return await window.nativeFetch(u,o);const x=await fetch(u,o);return{status:x.status,text:await x.text()}})();
  const r=await Promise.race([run,t]);let j=null;try{j=JSON.parse(r.text)}catch(e){}return{s:r.status,j:j||{},t:r.text};
}
async function gtoken(){
  const c=cred();if(!SY.gr)throw new Error('Chưa đăng nhập Google');if(SY.ga&&SY.gx>now()+6e4)return SY.ga;
  const r=await gf('https://oauth2.googleapis.com/token',{method:'POST',headers:FORM,body:'client_id='+enc(c.id)+'&client_secret='+enc(c.sec)+'&refresh_token='+enc(SY.gr)+'&grant_type=refresh_token'});
  if(!r.j.access_token){if(r.j.error=='invalid_grant'){SY.gr='';saveSY()}throw new Error('Phiên Google hết hạn, hãy đăng nhập lại')}
  SY.ga=r.j.access_token;SY.gx=now()+r.j.expires_in*1000;saveSY();return SY.ga;
}
const tokOk=()=>SY.ga&&SY.gx>now()+6e4;
function webToken(inter){
  return new Promise((ok,no)=>{
    if(!(window.google&&google.accounts))return no(new Error('Chưa tải xong dịch vụ Google, thử lại sau vài giây'));
    google.accounts.oauth2.initTokenClient({client_id:cred().id,scope:'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
      callback:r=>{if(r.error)return no(new Error(r.error_description||r.error));SY.ga=r.access_token;SY.gx=now()+r.expires_in*1000;SY.gr='web';SY.gm='appdata';SY.derr='';saveSY();fetchProfile(r.access_token);ok(r.access_token)},
      error_callback:e=>no(new Error(e&&e.type=='popup_closed'?'Bạn đã đóng cửa sổ đăng nhập':(e&&e.type)||'Không đăng nhập được'))
    }).requestAccessToken({prompt:inter?'':'none'});
  });
}
async function fetchProfile(t){try{const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+t}});if(r.ok){const d=await r.json();SY.user={name:d.name||'',email:d.email||''};saveSY();render(1)}}catch(e){}}
async function getTok(manual){
  if(!WEB)return gtoken();
  if(tokOk())return SY.ga;
  if(manual)return webToken(true);
  if(now()-(SY.silent||0)>6e5){SY.silent=now();saveSY();try{return await Promise.race([webToken(false),new Promise((_,no)=>setTimeout(()=>no(new Error('t')),8000))])}catch(e){}}
  throw new Error('Phiên Google đã hết hạn, bấm "Đồng bộ ngay" để đăng nhập lại');
}
const dText=()=>SY.derr?'Lỗi: '+SY.derr:SY.dlast?'Đã đồng bộ lúc '+new Date(SY.dlast).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'Đã đăng nhập, chưa đồng bộ';
const mg=(a,b)=>{const m=new Map(a.map(o=>[o.id,o]));b.forEach(o=>{const c=m.get(o.id);if(!c||(o.u||0)>(c.u||0))m.set(o.id,o)});return[...m.values()]};
function mergeIn(R){S.acc=mg(S.acc,R.acc||[]);S.tx=mg(S.tx,R.tx||[]);S.debt=mg(S.debt,R.debt||[]);if(R.cats&&R.cats.v==2&&(R.cats.u||0)>(S.cats.u||0))S.cats=R.cats;if(((R.me||{}).u||0)>((S.me||{}).u||0))S.me=R.me}
async function driveSync(manual){
  if(!SY.gr){if(manual)go('more');return}
  if(gsyncing){again=1;return}
  gsyncing=true;const before=JSON.stringify(S);
  try{
    const tk=await getTok(manual),fl=SY.gm=='file',h={Authorization:'Bearer '+tk},hj={Authorization:'Bearer '+tk,'Content-Type':'application/json'};
    const l=await gf('https://www.googleapis.com/drive/v3/files?'+(fl?'':'spaces=appDataFolder&')+'q='+enc(fl?`name='${FILE}' and trashed=false`:`name='${FILE}'`)+'&fields='+enc('files(id)'),{headers:h});
    if(l.s!=200)throw new Error('Drive lỗi '+l.s);
    let id=l.j.files&&l.j.files[0]?l.j.files[0].id:null;
    if(id){const d=await gf('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{headers:h});if(d.s!=200)throw new Error('Drive lỗi '+d.s);if(d.j&&d.j.acc)mergeIn(d.j)}
    save(1);
    if(!id){const c=await gf('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:hj,body:JSON.stringify(fl?{name:FILE}:{name:FILE,parents:['appDataFolder']})});if(c.s!=200)throw new Error('Drive lỗi '+c.s);id=c.j.id}
    const u=await gf('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:hj,body:JSON.stringify(S)});if(u.s!=200)throw new Error('Drive lỗi '+u.s);
    SY.dlast=now();SY.derr='';
  }catch(e){SY.derr=String(e.message||e)}
  gsyncing=false;saveSY();if(JSON.stringify(S)!=before||manual)render(1);
  const e2=$('#dst');if(e2)e2.textContent=dText();
  if(again){again=0;driveSync(0)}
}
async function gStart(){
  if($('#gid')){SY.gid=$('#gid').value.trim();if($('#gsc'))SY.gsc=$('#gsc').value.trim();saveSY()}
  const c=cred(),say=t=>{const e=$('#dst');if(e)e.innerHTML=t};
  if(WEB){if(!c.id){say('Chưa có Client ID (loại Web).');return}try{say('Đang mở cửa sổ đăng nhập Google...');await webToken(true);render(1);await driveSync(true)}catch(e){say('Lỗi: '+esc(e.message||e))}return}
  if(!c.id||!c.sec){say('Chưa có mã ứng dụng và mã bí mật.');return}
  try{
    say('Đang lấy mã đăng nhập...');let sc='https://www.googleapis.com/auth/drive.appdata';
    const dv=()=>gf('https://oauth2.googleapis.com/device/code',{method:'POST',headers:FORM,body:'client_id='+enc(c.id)+'&scope='+enc(sc)});
    let r=await dv();
    if(!r.j.device_code&&/scope/i.test(String(r.j.error_description||r.j.error||''))){sc='https://www.googleapis.com/auth/drive.file';r=await dv()}
    if(!r.j.device_code)throw new Error(r.j.error_description||r.j.error||'Không lấy được mã');
    SY.gp={iv:(r.j.interval||5)*1000,end:now()+r.j.expires_in*1000,sc,dc:r.j.device_code,msg:'Mở <b>'+esc(r.j.verification_url)+'</b> trên trình duyệt, nhập mã <b style="font-size:20px">'+esc(r.j.user_code)+'</b> rồi đăng nhập Google. Sau đó quay lại app, màn hình tự cập nhật (có thể mất vài giây).'};
    saveSY();say(SY.gp.msg);pollLogin();
  }catch(e){say('Lỗi: '+esc(e.message||e))}
}
async function pollLogin(){
  if(polling||!SY.gp||SY.gr)return;polling=true;const c=cred(),say=t=>{const e=$('#dst');if(e)e.innerHTML=t};
  try{
    while(SY.gp&&now()<SY.gp.end){
      await sleep(SY.gp.iv);if(!SY.gp)break;let t;
      try{t=await gf('https://oauth2.googleapis.com/token',{method:'POST',headers:FORM,body:'client_id='+enc(c.id)+'&client_secret='+enc(c.sec)+'&device_code='+enc(SY.gp.dc)+'&grant_type='+enc('urn:ietf:params:oauth:grant-type:device_code')})}catch(e){continue}
      if(t.j.refresh_token){SY.gr=t.j.refresh_token;SY.ga=t.j.access_token;SY.gx=now()+t.j.expires_in*1000;SY.gm=SY.gp.sc.indexOf('drive.file')>0?'file':'appdata';SY.gp=null;SY.derr='';saveSY();render(1);await driveSync(true);return}
      if(t.j.error=='slow_down')SY.gp.iv+=5000;
      else if(t.j.error&&t.j.error!='authorization_pending'){const m2=t.j.error_description||t.j.error;SY.gp=null;saveSY();say('Lỗi: '+esc(m2));return}
    }
    if(SY.gp){SY.gp=null;saveSY();say('Hết thời gian, hãy thử lại')}
  }finally{polling=false}
}
function logout(){if(!confirm('Đăng xuất Google? Dữ liệu trên máy vẫn được giữ.'))return;SY.gr='';SY.ga='';SY.user=null;saveSY();render(1)}
function syncCard(){
  const c=cred(),hasCfg=c.id&&(WEB||c.sec)&&window.DRIVE&&(WEB?DRIVE.webClientId:DRIVE.clientId);let b;
  if(SY.gp&&!SY.gr)b=`<div class="m" id="dst" style="margin-top:10px">${SY.gp.msg}</div><div class="btns"><button class="btn g" onclick="SY.gp=null;saveSY();render(1)">Hủy</button></div>`;
  else if(SY.gr)b=`<div class="m" id="dst" style="margin-top:8px">${dText()}</div><div class="btns"><button class="btn" onclick="driveSync(1)">Đồng bộ ngay</button><button class="btn g" onclick="logout()">Đăng xuất</button></div>`;
  else b=(hasCfg?'':`<label>Mã ứng dụng (Client ID)</label><input id="gid" value="${esc(SY.gid||'')}">${WEB?'':`<label>Mã bí mật (Client secret)</label><input id="gsc" value="${esc(SY.gsc||'')}">`}`)+`<div class="btns"><button class="btn" onclick="gStart()">Đăng nhập Google</button></div><div class="m" id="dst" style="margin-top:8px">Đồng bộ qua tài khoản Google, không cần chung Wi-Fi. Dùng cùng một tài khoản trên mọi máy.</div>`;
  return `<div class="card"><div class="who"><span class="av" style="color:var(--b);border-color:var(--b)">G</span><div><b style="word-break:break-word">${SY.gr?(SY.user&&SY.user.name?esc(SY.user.name):'Đã đăng nhập Google'):'Chưa đăng nhập'}</b><div class="m" style="word-break:break-all">${SY.gr?(SY.user&&SY.user.email?esc(SY.user.email):'Dữ liệu tự đồng bộ qua Google Drive'):'Dữ liệu chỉ lưu trên máy này'}</div></div></div>${b}</div>`;
}
document.addEventListener('click',e=>{if(kpOn&&!e.target.closest('#kp,#amtc'))kpClose()},true);
fixCats();render();
setTimeout(pollLogin,2000);setTimeout(()=>driveSync(0),1500);setInterval(()=>driveSync(0),30000);
addEventListener('online',()=>driveSync(0));
if(WEB){const g=document.createElement('script');g.src='https://accounts.google.com/gsi/client';g.async=true;document.head.appendChild(g)}
if('serviceWorker' in navigator&&!window.Capacitor&&(location.protocol=='https:'||location.hostname=='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollLogin()});
